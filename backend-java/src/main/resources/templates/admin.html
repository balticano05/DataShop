<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Админ')}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/header :: header('admin')}"></header>
    <main>
        <div class="container">
            <div class="page">
                <h1 class="page-title">Админ</h1>
                <div class="auth-error" th:if="${error != null}" th:text="${error}">Ошибка</div>
                <div class="auth-error" th:if="${created}" style="background:#ecfdf5;border-color:#a7f3d0;color:#047857">Датасет создан.</div>
                <div class="auth-error" th:if="${deleted}" style="background:#ecfdf5;border-color:#a7f3d0;color:#047857">Датасет удалён.</div>
                <div class="auth-error" th:if="${uploaded != null}" style="background:#ecfdf5;border-color:#a7f3d0;color:#047857">Файл загружен.</div>

                <div class="admin-grid">
                    <form class="card" method="post" th:action="@{/admin/products}">
                        <h2 style="margin-bottom:16px">Новый датасет</h2>
                        <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                        <div class="field">
                            <label>Название</label>
                            <div class="input"><input name="title" required minlength="3" maxlength="255"/></div>
                        </div>
                        <div class="field">
                            <label>Описание</label>
                            <div class="input"><input name="description" required maxlength="5000"/></div>
                        </div>
                        <div style="display:flex;gap:12px">
                            <div class="field" style="flex:1">
                                <label>Цена</label>
                                <div class="input"><input name="price" type="number" min="0.01" step="0.01" required/></div>
                            </div>
                            <div class="field" style="flex:1">
                                <label>Рейтинг</label>
                                <div class="input"><input name="rating" type="number" min="0" max="5" step="0.1" value="4.5"/></div>
                            </div>
                            <div class="field" style="flex:1">
                                <label>Остаток</label>
                                <div class="input"><input name="stockQuantity" type="number" min="0" value="10"/></div>
                            </div>
                        </div>
                        <div class="field">
                            <label>Изображения (минимум 3 URL через запятую)</label>
                            <div class="input"><input name="images" placeholder="https://..., https://..., https://..."/></div>
                        </div>
                        <button class="btn btn--primary btn--lg" type="submit" style="width:100%">Создать</button>
                    </form>

                    <div class="card">
                        <h2 style="margin-bottom:16px">Файлы</h2>
                        <form method="post" th:action="@{/admin/media/preview}" enctype="multipart/form-data">
                            <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                            <div class="field">
                                <label>Превью (изображение)</label>
                                <div class="file-row">
                                    <input type="file" name="file" accept="image/*" required/>
                                    <button class="btn btn--secondary-outline btn--md" type="submit">Загрузить</button>
                                </div>
                            </div>
                        </form>

                        <form method="post" th:action="@{/admin/media/dataset}" enctype="multipart/form-data">
                            <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                            <div class="field">
                                <label>Датасет</label>
                                <select name="productId" required style="width:100%;border:1px solid var(--color-border);border-radius:8px;height:42px;padding:0 10px">
                                    <option value="" th:each="p : ${products}" th:value="${p.id}" th:text="${p.title}">Датасет</option>
                                </select>
                            </div>
                            <div class="field">
                                <label>Файл датасета</label>
                                <div class="file-row">
                                    <input type="file" name="file" required/>
                                    <button class="btn btn--secondary-outline btn--md" type="submit">Загрузить</button>
                                </div>
                            </div>
                        </form>
                        <p class="form-note">Превью публичное; датасет приватный, скачивание — только покупателю по подписанной ссылке.</p>
                    </div>
                </div>

                <div class="card admin-list">
                    <h2>Каталог</h2>
                    <table>
                        <thead>
                        <tr><th>Название</th><th>Цена</th><th>Остаток</th><th>Файл</th><th></th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${products}">
                            <td>
                                <a th:href="@{/products/{id}(id=${p.id})}" th:text="${p.title}">Название</a>
                            </td>
                            <td th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 2, 'POINT')} + ' ₽'">0 ₽</td>
                            <td th:text="${p.stockQuantity}">0</td>
                            <td th:text="${p.stockQuantity >= 0 ? '—' : ''}">—</td>
                            <td>
                                <form method="post" th:action="@{/admin/products/{id}/delete(id=${p.id})}" class="inline-form">
                                    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                                    <button class="btn btn--secondary-outline btn--sm" type="submit">Удалить</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
