<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Регистрация')}"></head>
<body>
<div class="shell">
    <header th:replace="~{fragments/header :: header('login')}"></header>
    <main>
        <div class="container">
            <div class="card auth">
                <h1>Регистрация</h1>
                <p class="form-note">Создайте аккаунт покупателя.</p>
                <div class="auth-error" th:if="${error != null}" th:text="${error}">Ошибка</div>
                <form method="post" th:action="@{/register}">
                    <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
                    <input type="hidden" name="next" th:value="${next}"/>
                    <div class="field">
                        <label>Email</label>
                        <div class="input"><input name="email" type="email" required th:value="${email}" autocomplete="email"/></div>
                    </div>
                    <div class="field">
                        <label>Пароль</label>
                        <div class="input"><input name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password"/></div>
                    </div>
                    <button class="btn btn--primary btn--lg" type="submit" style="width:100%">Зарегистрироваться</button>
                </form>
                <p class="form-note">Уже есть аккаунт? <a th:href="@{/login(next=${next})}">Войти</a></p>
            </div>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
