databaseChangeLog:
  # SQL lives in separate files under changes/sql/legacy.
  # Keep existing databases compatible after moving SQL out of this changelog.
  - changeSet:
      id: 002-migrate-legacy-users-role
      author: datashop
      logicalFilePath: db/changelog/changes/002-legacy.xml
      validCheckSum: ANY
      changes:
        - sqlFile:
            path: db/changelog/changes/sql/legacy/001-migrate-legacy-users-role.sql
            relativeToChangelogFile: false
            splitStatements: false
